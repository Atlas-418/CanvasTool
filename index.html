<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CanvasTool</title>
</head>
<body>
<h1>CanvasTool</h1>
<button id="settings-toggle">Settings</button>

<section id="settings-panel" hidden>
  <h2>Settings</h2>
  <p>
    Get a Personal Access Token from your Canvas account:
    Account &rarr; Settings &rarr; "New Access Token" (Big blue button).
  </p>
  <form id="settings-form">
    <div>
      <label for="domain">Canvas domain (e.g. district.instructure.com)</label><br>
      <input type="text" id="domain" placeholder="district.instructure.com" required>
    </div>
    <div>
      <label for="token">Personal Access Token</label><br>
      <input type="password" id="token" required>
    </div>
    <button type="submit">Save</button>
    <button type="button" id="clear-settings">Clear saved data</button>
  </form>
</section>

<section id="status"></section>

<section id="courses">
  <h2>Courses</h2>
  <ul id="course-list"></ul>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
