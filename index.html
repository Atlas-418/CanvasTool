<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CanvasTool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tabs">
  <input type="radio" name="main-tabs" id="tab-courses" checked>
  <label for="tab-courses">Courses</label>

  <input type="radio" name="main-tabs" id="tab-assignments">
  <label for="tab-assignments">Assignments</label>

  <input type="radio" name="main-tabs" id="tab-classes">
  <label for="tab-classes">Classes</label>

  <input type="radio" name="main-tabs" id="tab-settings">
  <label for="tab-settings">Settings</label>

  <div class="panel" id="panel-courses">
    <input type="radio" name="course-view" id="course-view-list" checked>
    <div class="course-screen" id="course-screen-list">
      <h2>Courses</h2>
      <div id="status"></div>
      <div id="course-list"></div>
    </div>
  </div>

  <div class="panel" id="panel-assignments">
    <h2>Assignments</h2>
    <p>
      Coming soon...
      This one for sure!
    </p>
  </div>

  <div class="panel" id="panel-classes">
    <h2>Live Classes</h2>
    <p>
      Coming soon...
      Probably
    </p>
  </div>

  <div class="panel" id="panel-settings">
    <h2>Settings</h2>
    <p>
      Get a Personal Access Token from your Canvas account:
      Account &rarr; Settings &rarr; "New Access Token" (Big blue button).
    </p>
    <form id="settings-form">
      <div>
        <label for="domain">Canvas domain (e.g. district.instructure.com)</label><br>
        <input type="text" id="domain" placeholder="district.instructure.com" required>
      </div>
      <div>
        <label for="token">Personal Access Token</label><br>
        <input type="password" id="token" required>
      </div>
      <button type="submit">Save</button>
      <button type="button" id="clear-settings">Clear saved data</button>
    </form>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
